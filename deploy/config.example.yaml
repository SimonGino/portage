# 进程级配置的样例，兼作容器内的默认配置（烤进镜像成 /etc/portage/config.yaml）。
# 要改（比如全局限流），把它拷成部署目录里的 config.yaml 再改——forward/admin 两份
# compose 都会把 ./config.yaml 挂进去盖掉烤的这份。config.yaml 已在 .gitignore 里，
# 改出来的那份不会误入仓库。
#
# **这份文件只管进程级配置**（端口、库路径、重试、限流）。业务配置——渠道 / 纳管模型 /
# 接入点 / 候选 / 凭证 / API Key——不在这里，它有两条入口，走哪条看有没有挂声明文件
# （口径层 §2.9）：
#
#   - 不挂：落 DB，由管理端（/admin）维护。
#   - 挂了：那份 channels.yaml 是**唯一事实源**，启动时 apply 进 DB，管理端只读。
#     路径走 PORTAGE_CHANNELS 环境变量——本镜像的 ENTRYPOINT 把 -config 写死了，
#     用 flag 就得覆盖整个 entrypoint，而 env 加一行就行。
#
# 顺带一条形态：**不设管理密码 = 纯转发形态**，/admin 与 /admin/api/* 整个不注册
# （路由级 404），只剩 /v1 转发面。两件事正交——挂不挂文件决定「谁是事实源」，
# 有没有密码决定「管理面存不存在」。
#
# listen 绑 0.0.0.0 而不是宿主上的默认 127.0.0.1：容器里的 loopback 只有容器自己
# 看得见，绑它等于端口映射永远连不上。边界因此从「进程绑哪个地址」挪到了「你把
# 端口发布给谁」——`-p 127.0.0.1:8317:8317` 只给本机，`-p 8317:8317` 是整个局域网。
# compose 里出厂是后者（口径层 v0.87），要收窄见 docker-compose.yml 的 ports 注释。
listen: "0.0.0.0:8317"

# 落在挂载进来的 /data 里。写容器可写层的话 docker rm 一执行，渠道、key、全部流水一起没。
db_path: "/data/gateway.db"

# 管理密码（带管理端形态才需要）。通常走环境变量 PORTAGE_ADMIN_PASSWORD（env 优先），
# 挂载的 config.yaml 里写也行——挂载文件不进镜像层，没有「烤进镜像」那个顾虑。
# 只用于初始化：库里有密码之后改这里不生效，改密码走管理端界面。
# admin_password: ""

# 排障开关，平时关着：Claude Code 2.x 单轮请求体约 185 KB，打开后日志涨得很快。
log_bodies: false

retry:
  max_retries: 2      # 同一份凭证上的退避重试次数，不含首次尝试
  max_attempts: 6     # 一次请求的全局上游尝试上限，跨凭证累计（口径层 v0.38）；写 0 即不封顶
  base_delay: 500ms
  max_delay: 10s

# 全局限流：一只桶，不分 key/IP，只挂转发面（/healthz 与 /admin 不受影响）。
# 它防的是 key 泄露或被扫时刷爆上游账单，不是公平调度。超限回 429 + Retry-After: 1。
# 写 0 关掉。10 QPS 的取值依据见口径层 v0.15：agent 会话峰值 <5 QPS，留了双会话余量。
rate_limit_qps: 10
rate_limit_burst: 20

# 流水保留期：启动清一次 + 每天清一次 N 天前的 call_logs（口径层 v0.93，#35）。
# 写 0 即永久保留。删行不跟 VACUUM——库文件不缩但停止增长，稳定在保留期内的峰值。
call_log_retention_days: 90
