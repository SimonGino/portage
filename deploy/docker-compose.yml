# 用法（在仓库根目录）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 起来之后库是空的（日志里会有一条 `api_keys 表是空的，所有转发请求都会回 401`），
# 得先灌配置——渠道、纳管模型、接入点、候选、网关 key。
#
# scratch 镜像里既没有 shell 也没有 sqlite3，所以对着卷里的库另起一个容器灌：
#
#   docker run --rm --user 65532:65532 \
#     -v ai-gateway-data:/data -v "$PWD/scripts:/s:ro" keinos/sqlite3 \
#     sqlite3 /data/gateway.db ".read /s/seed-example.sql"
#
# --user 65532:65532 不能省：卷是按网关那个 uid 建的，用别的身份进去只能只读，
# 报的是 `attempt to write a readonly database`，看不出是权限问题。
#
# 灌完不用重启——渠道、key 都是每次请求现查的。只有配置文件改了才要重启。
#
# 看用量同理：
#   docker run --rm --user 65532:65532 -v ai-gateway-data:/data keinos/sqlite3 \
#     sqlite3 -header /data/gateway.db \
#     'SELECT created_at, api_key_name, model_requested, status FROM call_logs ORDER BY id DESC LIMIT 20;'

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-gateway:local
    restart: unless-stopped
    ports:
      # 只发布给本机。要让局域网里另一台机器连过来，改成 "8317:8317"——
      # 那一刻网关就暴露在整个网段上，只有 key 鉴权挡着，没有 TLS 也没有限流
      # （口径层 §2.7 把这两样列为公网暴露的必做项，都在 M3）。
      - "127.0.0.1:8317:8317"
    volumes:
      - ai-gateway-data:/data
      # 要改配置就把这行放开，改宿主上的 deploy/config.docker.yaml。
      # - ./config.docker.yaml:/etc/ai-gateway/config.yaml:ro
    healthcheck:
      # scratch 里没有 curl/wget，只能让网关自己探自己——gateway 二进制不带
      # 探活子命令，所以这里用 Docker 25+ 的原生 CMD-SHELL 也不行。
      # 结论：健康检查交给外部（compose 只保证进程活着），别在镜像里塞一个
      # 只为探活而存在的 shell。
      disable: true

volumes:
  ai-gateway-data:
