<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portage · 排行 v2</title>
<!--
  排行页 v2 样稿（PO 2026-08-18 就 AI Usage 那三张截图提的改造）

  这一页的问从一变三，但三问是**一条下钻链**，不是三张并排的图：
    ① 节律带  什么时候烧的
    ② 切片井  那一段是怎么构成的
    ③ 排行列表 谁在烧（跟着切片走）

  枢纽是「区间（interval）」这个抽象：一个桶数组喂三种排布，一套统计文案吃三种窗口。
    1 天 → 区间 = 1 小时（24 个），画柱
    7 天 → 区间 = 1 小时（168 个），画点阵
    30 天 → 区间 = 1 天（30 个），画日历（窗口盖住的那几周）

  照参照图做的：区间抽象、五个统计量、日历、点区间开明细。
  环形图与 BY MODEL / BY API Key 堆叠条：起初论证掉了（与排行列表同一份数据，口径层
  v0.60），PO 2026-08-18 指出参照图有、要求摆上来对着看。现在三处共用同一个 scope，
  选中一格会一起跟着变；「按模型」的图例因此在一屏里出现三遍，待裁。
  没照做的（逐条有据）：
    - 切片井里的 by model / by key top5：排行列表已经跟着切片走了，再列一遍是重复。
      井里只答「这一段花在哪种 token 上」，排行列表答「这一段谁在烧」。
    - Estimated cost：PO 2026-08-18 裁「先不做」（要单价表，且 v0.71 之后 input 是
      毛值，不拆 cache 会系统性高估）。
    - 逐模型时间序列：PO 2026-08-18 裁「不做」。
    - Reasoning 单列一行：v0.66 裁过，思考在 output 里面，单列会被读成第四笔加数。
    - 数字 count-up 动画：DESIGN §8 默认静止。参照图 30d 那张的大数字有动画残影。
    - 参照图 24h 那张「Longest streak 3 / 0 active intervals in a row」文案与数字
      对不上，是他们那边的 bug，不抄。

  色：热度用**墨色单色 5 档**（DESIGN §4「单色是默认态」，语义色只给状态）。
  参照图用蓝，这里不引入新色相；真要换成一个数据色相，改 --heat-* 五个变量即可。

  数据是构造的（种子固定），只为看排布，不代表真实分布。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  /* ── token：与 web/src/styles.css 逐字同源，改动只加不改 ─────────────── */
  :root {
    --paper: #edece3;
    --canvas: #f5f4ed;
    --ink: #1c1a15;
    --ink-2: #3f3a2f;
    --mute: #6b6252;
    --faint: #8a8172;
    --line: #ddd9c9;
    --line-soft: #e7e3d5;
    --sunken: #eae7da;
    --chip: #efece0;
    --hover: rgba(28, 26, 21, 0.045);
    --r: 20px;
    --r-sm: 16px;
    --side: 248px;
    --display: "Outfit", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    --sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
    --text: var(--ink);
    --muted: var(--mute);
    --err-text: #9c2f26;
    --data-in: #4a6b52;
    --data-out: #8a6a3c;
    color-scheme: light;
  }

  /* 分类色板：只给「按模型 / 按 API Key 的构成」这两块用（环 + 堆叠条）。
     DESIGN §4 说颜色只承载语义、单色是默认态；这五个色是 PO 2026-08-18 看了样稿
     后要求补上参照图那两块时开的口子（已回写 DESIGN v0.30 / 口径层 v0.86），
     **用途封死在构成图里**，不外溢到列表、状态、热度任何一处（热度仍是墨色单色）。

     取值出自 dataviz 参考色板的前五槽，在羊皮纸画布 #f5f4ed 上跑过验证器：
       五槽全过；最差相邻 CVD ΔE 9.1（阈值 8）、常视 ΔE 19.6（阈值 15）。
       四个色对羊皮纸 < 3:1（2.9 / 2.55 / 1.96 / 2.44）→ 触发 relief 条款，
       办法是每个系列都直接标名字 + 百分比（堆叠条那两行图例），已满足。
     **改任何一个值都要重跑验证器**，别凭眼睛调。

     第 6 名及以后一律并进「其余」的中性灰，不生成第 6 个色相。 */
  :root {
    --cat-1: #2a78d6;
    --cat-2: #eb6834;
    --cat-3: #1baf7a;
    --cat-4: #eda100;
    --cat-5: #e87ba4;
    --cat-other: color-mix(in srgb, var(--ink) 28%, var(--canvas));
  }
  /* 热度 5 档 + 一档「空」。用 color-mix 混墨色与画布，亮暗两套自动成立：
     暗色下 --ink 是浅的、--canvas 是深的，同一条公式画出来是「越热越亮」。 */
  :root {
    --heat-0: color-mix(in srgb, var(--ink) 7%, var(--canvas));   /* 有调用但没报 token */
    --heat-1: color-mix(in srgb, var(--ink) 16%, var(--canvas));
    --heat-2: color-mix(in srgb, var(--ink) 31%, var(--canvas));
    --heat-3: color-mix(in srgb, var(--ink) 50%, var(--canvas));
    --heat-4: color-mix(in srgb, var(--ink) 72%, var(--canvas));
    --heat-none: transparent;                                     /* 0 次调用 */
    --heat-out: color-mix(in srgb, var(--ink) 5%, var(--canvas));  /* 窗口之外 */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    text-wrap: pretty;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  /* ── 壳 ──────────────────────────────────────────────────────────── */
  .app { display: flex; height: 100%; min-height: 0; }
  .rail {
    width: var(--side); flex: 0 0 var(--side); height: 100%;
    display: flex; flex-direction: column; padding: 18px 12px 14px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 18px; }
  .brand svg { width: 22px; height: 22px; display: block; flex: 0 0 22px; }
  .brand b { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.03em; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 12px; border-radius: var(--r-sm);
    color: var(--ink-2); text-decoration: none;
  }
  .nav a svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: 0.72; }
  .nav a:hover { background: var(--hover); }
  .nav a.active { background: var(--sunken); color: var(--ink); font-weight: 500; }
  .nav a.active svg { opacity: 1; }
  .rail-mid { flex: 1; min-height: 0; }
  .account { padding: 10px 8px 4px; display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  .acct-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--sunken);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: -0.03em;
  }
  .who strong { display: block; font-weight: 500; font-size: 14px; }
  .who span { display: block; color: var(--mute); font-size: 12px; }
  .acct-acts { display: flex; gap: 4px; padding: 0 4px; }
  .acct-acts button { color: var(--mute); font-size: 13px; padding: 6px 8px; border-radius: 12px; }
  .acct-acts button:hover { background: var(--hover); color: var(--ink); }

  .main {
    flex: 1; min-width: 0; height: 100%; overflow: auto;
    background: var(--canvas); border-radius: 24px 0 0 24px;
    padding: 36px 32px 48px;
  }
  .main > * { max-width: 920px; margin: 0 auto; width: 100%; }

  .page-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .page-head h1 {
    margin: 0; font-family: var(--display); font-weight: 600;
    font-size: 26px; line-height: 1.2; letter-spacing: -0.025em;
  }

  .segmented { display: inline-flex; padding: 4px; gap: 4px; background: var(--paper); border-radius: 14px; }
  .segment { padding: 5px 11px; border-radius: 5px; color: var(--muted); font-size: 13px; }
  .segment:hover { color: var(--text); }
  .segment.is-on { background: var(--canvas); color: var(--ink); font-weight: 500; }

  /* ── 指标条：一条有主次的行，不是两张等大卡（DESIGN §9） ──────────── */
  .stats {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 34px;
    padding: 0 0 16px; border-bottom: 1px solid var(--line-soft);
  }
  .stat-lead { display: flex; align-items: baseline; gap: 9px; }
  .stat-lead-value { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat-lead-label { font-size: 13px; color: var(--muted); }
  .stat-tokens {
    margin-left: auto; display: flex; align-items: baseline; flex-wrap: wrap;
    gap: 4px 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .stat-tokens b { font-size: 15px; font-weight: 600; color: var(--text); }

  /* ── 节律带 ──────────────────────────────────────────────────────── */
  .sky { padding: 18px 0 4px; }
  .sky-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px 20px; flex-wrap: wrap; margin-bottom: 14px;
    font-size: 13px; color: var(--muted);
  }
  .sky-head b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sky-legend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .sky-legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }

  /* 排布①：1 天 = 24 根柱。沿用概览页那张图的做法，只把横轴换成小时。 */
  .sky-bars { display: flex; align-items: flex-end; gap: 6px; height: 132px; }
  .sky-bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .sky-bar {
    width: 100%; border-radius: 3px 3px 0 0; background: var(--heat-3);
    transition: background 0.12s ease;
  }
  .sky-bar-col:hover .sky-bar { background: var(--ink); }
  .sky-bar-col.is-sel .sky-bar { background: var(--ink); }
  .sky-bar-col.is-empty .sky-bar { background: var(--heat-out); }

  /* 排布②：7 天 = 7 行 × 24 列点阵，尺寸与深浅双编码。 */
  .sky-grid { display: grid; grid-template-columns: 44px 1fr; gap: 0 10px; align-items: center; }
  .sky-rowlab { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sky-row { display: grid; grid-template-columns: repeat(24, 1fr); height: 26px; align-items: center; justify-items: center; }
  .sky-dot-hit { display: grid; place-items: center; width: 100%; height: 26px; border-radius: 6px; }
  .sky-dot-hit:hover { background: var(--hover); }
  .sky-dot { border-radius: 50%; background: var(--heat-2); display: block; }
  .sky-dot-hit.is-sel { box-shadow: inset 0 0 0 1.5px var(--ink); }

  /* 排布③：30 天 = 日历，只画窗口盖住的那几周（PO 2026-08-18 裁）。
     窗口外那几格仍画成灰底占位——一周七格的结构不能缺角。 */
  .cal { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; --cell: 34px; --gap: 7px; }
  .cal-months { display: grid; font-size: 11px; color: var(--muted); height: 18px; }
  .cal-months span { grid-row: 1; white-space: nowrap; overflow: visible; }
  /* justify-content:start 必须写：.cal-body 占 1fr，不钉住起点的话 grid 会把
     那几列摊满整行——只有六列，不钉住起点立刻散成一片。 */
  .cal-body { display: grid; grid-auto-flow: column; justify-content: start; gap: var(--gap); }
  .cal-week { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap); }
  .cal-day {
    width: var(--cell); height: var(--cell); border-radius: 5px;
    background: var(--heat-none); box-shadow: inset 0 0 0 1px var(--line-soft); padding: 0;
  }
  .cal-day.is-out { background: var(--heat-out); box-shadow: none; }
  .cal-day.is-in { box-shadow: none; }
  .cal-day.is-in:hover { box-shadow: 0 0 0 1.5px var(--line); }
  .cal-day.is-sel, .cal-day.is-in.is-sel:hover { box-shadow: 0 0 0 1.5px var(--ink); }
  .cal-wdays {
    display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap);
    font-size: 11px; color: var(--muted); text-align: right;
  }
  .cal-wdays span { line-height: var(--cell); }

  .sky-hint { margin: 14px 0 0; font-size: 13px; color: var(--faint); }

  /* 环在左、节律在右。三档都走这个两栏。参照图在 30d 那屏把环收掉，是因为它那张
     53 周画布要占满整行；画布收成六周之后这个特例就没依据了。 */
  .sky-split { display: grid; grid-template-columns: 236px 1fr; gap: 12px 30px; align-items: start; }
  .donut-wrap { position: relative; width: 176px; margin: 4px auto 0; }
  .donut-wrap svg { display: block; width: 100%; height: auto; }
  .donut-mid {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none;
  }
  .donut-mid b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .donut-mid span { display: block; margin-top: 2px; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }

  /* 段与段之间留 2px 画布色的缝，段界不靠色差自己撑。 */
  .stack {
    display: flex; gap: 2px; height: 9px; margin: 4px 0 9px;
    /* 圆角与裁切放容器上：段宽是百分比、缝是 2px 定值，加起来必然比 100% 宽
       一点，末段会被挤出去。容器裁一刀最省事，而 flex 的收缩按基准宽等比分摊，
       比例不会因为这一刀走样。 */
    border-radius: 5px; overflow: hidden;
  }
  .stack i { border-radius: 2px; min-width: 2px; }

  /* 每个系列都直接标名字 + 百分比——亮色下有三个色对白底不足 3:1，
     dataviz 的 relief 条款要的就是这个，不能只留色块。 */
  .cat-legend {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 12.5px; color: var(--ink-2);
  }
  .cat-legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .cat-legend i { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .cat-legend em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat-legend b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 15em; }
  .cat-title { font-size: 12px; color: var(--faint); letter-spacing: 0.02em; }

  .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px 34px;
    margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft);
  }

  /* ── 切片井 ──────────────────────────────────────────────────────── */
  .slice {
    position: relative; margin: 18px 0 4px; padding: 18px 20px;
    background: var(--sunken); border-radius: var(--r);
    display: grid; grid-template-columns: minmax(200px, 1fr) minmax(260px, 1.4fr) auto;
    gap: 12px 28px; align-items: start;
  }
  .slice::before {
    content: ""; position: absolute; top: -6px; left: var(--caret, 40px);
    width: 12px; height: 12px; background: var(--sunken); transform: rotate(45deg); border-radius: 2px;
  }
  .slice-when { font-size: 13px; color: var(--mute); }
  .slice-total { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .slice-total b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .slice-calls { font-size: 13px; color: var(--mute); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .slice-bad { color: var(--err-text); }
  .comp-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
  .comp-legend { display: grid; gap: 5px; font-size: 13px; }
  .comp-legend div { display: flex; align-items: center; gap: 8px; }
  .comp-legend i { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .comp-legend span { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; }
  .comp-cache { background: color-mix(in srgb, var(--ink) 26%, var(--canvas)); }
  .comp-in { background: var(--data-in); }
  .comp-out { background: var(--data-out); }
  .slice-x { color: var(--mute); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 10px; }
  .slice-x:hover { background: var(--hover); color: var(--ink); }

  /* ── 统计带：五个数，一套文案吃三种窗口 ──────────────────────────── */
  .ivstats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px 24px; padding: 18px 0 4px; margin-top: 14px; border-top: 1px solid var(--line-soft);
  }
  .ivstat dt { font-size: 12px; color: var(--muted); }
  .ivstat dd { margin: 2px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ivstat small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ── 排行列表（现有形态，一行不改） ──────────────────────────────── */
  .rank-scope { margin: 22px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rank-scope-note { font-size: 13px; color: var(--mute); }
  .rank-list { list-style: none; margin: 0; padding: 6px 0 0; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .rank-row:last-child { border-bottom: 0; }
  .rank-no { flex: none; width: 20px; text-align: right; font-size: 12px; color: var(--muted); }
  .rank-icon { flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--chip); display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--mute); font-family: var(--display); }
  .rank-main { flex: 1; min-width: 0; }
  .rank-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 14px; }
  .sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .rank-bad { color: var(--err-text); }
  .rank-metric { flex: none; text-align: right; white-space: nowrap; }
  .rank-metric-value { font-size: 15px; font-weight: 600; }
  .rank-metric-unit { margin-left: 4px; font-size: 12px; color: var(--muted); }

  .notes {
    margin-top: 40px; padding: 18px 20px; background: var(--paper);
    border-radius: var(--r); font-size: 13px; color: var(--ink-2);
  }
  .notes h3 { margin: 0 0 8px; font-family: var(--display); font-size: 15px; font-weight: 600; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin: 4px 0; }
  .notes code { background: var(--chip); padding: 1px 5px; border-radius: 5px; }

  @media (max-width: 860px) {
    .rail { display: none; }
    .main { border-radius: 0; padding: 24px 18px 40px; }
    .slice, .breakdown { grid-template-columns: 1fr; }
    .sky-split { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="rail" aria-label="导航">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M3,6 L21,6 L17,13 L7,13 Z M0,17 L9,17 L9,21 L0,21 Z M15,17 L24,17 L24,21 L15,21 Z"></path>
      </svg>
      <b>Portage</b>
    </div>
    <nav class="nav" aria-label="五项">
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h16M7 12h10M10 16h4"></path></svg>模型</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="12" r="3"></circle><path d="M11 12h9l-2 2m2-2-2-2"></path></svg>API Key</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 7h11M8 12h11M8 17h8"></path><path d="M5 7.2v.01M5 12.2v.01M5 17.2v.01"></path></svg>调用记录</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="12" r="3"></circle><circle cx="16" cy="12" r="3"></circle><path d="M11 12h2"></path></svg>接入点</a>
      <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 17V11M12 17V7M18 17v-4"></path></svg>排行</a>
    </nav>
    <div class="rail-mid"></div>
    <div class="account">
      <div class="who">
        <div class="acct-avatar" aria-hidden="true">宇</div>
        <div><strong>宇辰</strong><span>本机唯一管理员</span></div>
      </div>
      <div class="acct-acts"><button type="button">改密码</button><button type="button">退出</button></div>
    </div>
  </aside>

  <main class="main">
    <div id="page"></div>
  </main>
</div>

<script>
/* ══ 构造数据 ═══════════════════════════════════════════════════════════
   种子固定的伪随机，保证每次打开长得一样。真接口是 /usage/buckets。       */

const NOW = new Date(2026, 7, 18, 15, 0, 0);          // 2026-08-18 15:00 本地
const HOURS = 30 * 24;                                 // 造 30 天的小时桶

/* mulberry32。不用课本那个 LCG——`_s * 1103515245` 在 JS 里超出 53 位精度，
   低位被抹掉，「随机数」会退化成肉眼可见的图案，热力图上直接露馅。 */
let _s = 20260818 >>> 0;
function rnd() {
  _s = (_s + 0x6d2b79f5) >>> 0;
  let t = _s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const MODELS = [
  { name: "claude-opus-5[1m]",        w: 0.44, ic: "CL" },
  { name: "gpt-5.6-sol",              w: 0.27, ic: "GP" },
  { name: "claude-fable-5",           w: 0.14, ic: "CL" },
  { name: "glm-4.6",                  w: 0.08, ic: "GL" },
  { name: "kimi-k2-0905",             w: 0.05, ic: "KI" },
  { name: "claude-haiku-4-5-20251001", w: 0.02, ic: "CL" },
];
const KEYS = [
  { name: "laptop-cc", w: 0.54 }, { name: "codex-cli", w: 0.29 },
  { name: "cherry-studio", w: 0.15 }, { name: "(未鉴权)", w: 0.02 },
];
const CREDS = [
  { name: "anthro-main", w: 0.47 }, { name: "packy-relay", w: 0.29 },
  { name: "zhipu-1", w: 0.13 }, { name: "kimi-1", w: 0.07 }, { name: "(未走到上游)", w: 0.04 },
];

/* 一个桶 = 一小时。造一条有昼夜节律、有周末低谷、有几段连续冲刺的曲线，
   否则热力图上看不出「排布好不好用」——均匀噪声画什么都好看。 */
const DAY_CURVE = [
  0.30, 0.14, 0.06, 0.03, 0.02, 0.02, 0.03, 0.08,   // 00–07
  0.22, 0.58, 0.88, 0.92, 0.70, 0.48, 0.82, 0.95,   // 08–15
  0.90, 0.72, 0.44, 0.38, 0.55, 0.78, 0.72, 0.52,   // 16–23
];
const buckets = [];
let burst = 0;                                         // 连着几个小时的冲刺
for (let i = HOURS - 1; i >= 0; i--) {
  const t = new Date(NOW.getTime() - i * 3600e3);
  t.setMinutes(0, 0, 0);
  const h = t.getHours(), dow = t.getDay();
  // 一天 24 格的作息曲线：上午起量、午后一段、晚上又一波、凌晨基本没人。
  let base = DAY_CURVE[h];
  if (dow === 0 || dow === 6) base *= 0.5;              // 周末低
  // 冲刺是**连着好几个小时**的，不是孤立的一格：真实的用法是坐下来干一晚上，
  // 而「最长连续」这个统计量只有在数据里真有连片时才说得出话。
  if (burst > 0) burst--;
  else if (base > 0.15 && rnd() < 0.05) burst = 3 + Math.floor(rnd() * 6);
  const spike = burst > 0 ? 2.6 + rnd() * 2.4 : 1;
  const active = burst > 0 || rnd() < base * 1.1;
  const calls = active ? Math.max(1, Math.round((2 + rnd() * 26) * base * spike)) : 0;
  const tokens = calls === 0 ? 0 : Math.round(calls * (9000 + rnd() * 190000) * spike);
  const errors = calls === 0 ? 0 : (rnd() < 0.11 ? Math.max(1, Math.round(calls * rnd() * 0.16)) : 0);

  /* 按权重把这一小时的量摊到模型 / key / 凭证上，摊法带噪声——同一小时里
     通常只有一两个模型在跑，全按平均权重摊会让每个切片长得一模一样。 */
  const split = (list) => {
    const picked = {}; let left = tokens;
    const shuffled = list.map((m) => ({ m, r: rnd() * m.w })).sort((a, b) => b.r - a.r);
    shuffled.forEach(({ m }, idx) => {
      const take = idx === shuffled.length - 1 ? left : Math.round(left * (0.35 + rnd() * 0.5));
      picked[m.name] = take; left -= take;
    });
    return picked;
  };
  buckets.push({
    t, calls, errors, tokens,
    byModel: split(MODELS), byKey: split(KEYS), byCred: split(CREDS),
  });
}

/* 构成：流水的 input_tokens 是**毛值**（口径层 v0.71，含缓存读写），所以
   井里那条构成条画的是 缓存读 / 净输入 / 输出 三段，净输入 = 毛值 − 缓存两项。 */
function comp(tokens) {
  const out = Math.round(tokens * 0.062);
  const cacheRead = Math.round(tokens * 0.55);
  const cacheWrite = Math.round(tokens * 0.062);
  return { out, cacheRead, cacheWrite, netIn: tokens - out - cacheRead - cacheWrite };
}

/* ══ 格式化 ═══════════════════════════════════════════════════════════ */
const fmt = (n) => {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
};
const fmtInt = (n) => n.toLocaleString("en-US");
const pad = (n) => String(n).padStart(2, "0");
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
const WD = ["日", "一", "二", "三", "四", "五", "六"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ══ 区间：一个抽象，三种粒度 ═════════════════════════════════════════

   窗口必须对齐**本地自然日的 00:00**（口径层 v0.55「今天算一天」），不能拿
   `最后 168 个小时桶` 顶替：那样第 0 列是「七天前的 16 点」而不是 0 点，横轴
   那排 00/03/06 的标签会整体错位——图还在，但它说的每一句都是假的。

   代价是窗口尾巴上多出今天还没走到的那几个小时。它们既不是「0 次调用」也不是
   「没报 token」，是**还没发生**，第三档：不画、不可点、不进活跃区间的分母。
   （参照图这一档是混着算的，所以它的 Active intervals 分母永远偏大。） */
const hourKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}`;
const byHour = new Map(buckets.map((b) => [hourKey(b.t), b]));
const blank = (t) => ({ t, calls: 0, errors: 0, tokens: 0, byModel: {}, byKey: {}, byCred: {}, future: t > NOW });

function intervals(days) {
  const start = new Date(NOW);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - (days === 1 ? 0 : days === 7 ? 6 : 29));

  if (days === 30) {                                   // 区间 = 1 天
    const list = [];
    for (let i = 0; i < 30; i++) {
      const day = new Date(start);
      day.setDate(start.getDate() + i);
      const cur = blank(day);
      for (let h = 0; h < 24; h++) {
        const t = new Date(day); t.setHours(h);
        const b = byHour.get(hourKey(t));
        if (!b) continue;
        cur.calls += b.calls; cur.errors += b.errors; cur.tokens += b.tokens;
        for (const dim of ["byModel", "byKey", "byCred"]) {
          for (const [k, v] of Object.entries(b[dim])) cur[dim][k] = (cur[dim][k] || 0) + v;
        }
      }
      list.push(cur);
    }
    return { unit: "day", list };
  }

  const n = days === 1 ? 24 : 168;
  const list = [];
  for (let i = 0; i < n; i++) {
    const t = new Date(start);
    t.setHours(start.getHours() + i);
    list.push(byHour.get(hourKey(t)) || blank(t));
  }
  return { unit: "hour", list };
}

/* 五个统计量全部从同一个数组算出来，后端不多给一个数。
   分母只数**已经走完**的区间，还没到的那几个小时不进账。 */
function ivStats(list) {
  const past = list.filter((b) => !b.future);
  const total = past.reduce((a, b) => a + b.tokens, 0);
  const activeN = past.filter((b) => b.calls > 0).length;
  const peak = past.reduce((a, b) => (b.tokens > a.tokens ? b : a), past[0]);
  let streak = 0, best = 0;
  past.forEach((b) => { streak = b.calls > 0 ? streak + 1 : 0; best = Math.max(best, streak); });
  return { total, activeN, n: past.length, peak, streak: best, avg: past.length ? Math.round(total / past.length) : 0 };
}

/* 热度分档：按**活跃区间的分位**切，不按最大值等分——一段冲刺会把 max 拉到
   天上，等分之后其余全落最低档，整张图变成「一个亮点 + 一片灰」。 */
function heatScale(list) {
  const vals = list.filter((b) => !b.future && b.tokens > 0).map((b) => b.tokens).sort((a, b) => a - b);
  if (!vals.length) return () => -1;
  const q = (p) => vals[Math.min(vals.length - 1, Math.floor(vals.length * p))];
  const cuts = [q(0.25), q(0.5), q(0.75), q(0.92)];
  return (b) => {
    if (b.future) return -2;             // 还没到
    if (b.calls === 0) return -1;        // 没有调用
    if (b.tokens === 0) return 0;        // 有调用但上游没报 token
    return b.tokens <= cuts[0] ? 1 : b.tokens <= cuts[1] ? 2 : b.tokens <= cuts[2] ? 3 : 4;
  };
}

/* ══ 状态 ═════════════════════════════════════════════════════════════ */
// sel = 选中区间的下标。
const state = { days: 7, dim: "model", sel: null };

/* ══ 三种排布 ═════════════════════════════════════════════════════════ */

/**
 * 排布①：柱。1 天 = 24 根，横轴小时。概览页那张 UsageChart 改几行就是它。
 */
function renderBars(list, scale, { label, every }) {
  const max = Math.max(...list.map((b) => b.tokens), 1);
  return `<div class="sky-bars">${list.map((b, i) => {
    const tip = label(b);
    if (b.future) return `<span class="sky-bar-col" title="${tip} · 还没到"></span>`;
    // 「有调用但上游没报 token」留一线高度，让它仍占一格位置；「没有调用」是真的 0。
    const h = b.tokens ? Math.max((b.tokens / max) * 100, 2) : (b.calls ? 2 : 0);
    return `<button type="button" class="sky-bar-col${state.sel === i ? " is-sel" : ""}${b.calls ? "" : " is-empty"}" data-iv="${i}"
      title="${tip} · ${fmtInt(b.calls)} 次 · ${fmtInt(b.tokens)} token">
      <span class="sky-bar" style="height:${h}%"></span></button>`;
  }).join("")}</div>
  <div class="sky-row" style="grid-template-columns:repeat(${list.length},1fr);height:auto;margin-top:7px">
    ${list.map((b, i) => `<span style="font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">${i % every === 0 ? label(b) : ""}</span>`).join("")}
  </div>`;
}

/** 排布②：7 天 = 7 行 × 24 列，尺寸 + 深浅双编码。 */
function renderMatrix(list, scale) {
  const rows = [];
  for (let d = 0; d < 7; d++) rows.push(list.slice(d * 24, d * 24 + 24));
  const cells = rows.map((row, d) => {
    const day = row[0].t;
    return `<div class="sky-rowlab">周${WD[day.getDay()]} ${day.getDate()}</div>
      <div class="sky-row">${row.map((b, c) => {
        const i = d * 24 + c, lv = scale(b);
        if (lv === -2) return `<span class="sky-dot-hit" title="${md(b.t)} ${pad(b.t.getHours())}:00 · 还没到"></span>`;
        // 尺寸与深浅双编码：小屏上深浅先糊，尺寸还在；打印/低对比屏反过来。
        const size = lv < 0 ? 4 : 5 + lv * 2.6;
        const bg = lv < 0 ? "var(--heat-out)" : `var(--heat-${lv})`;
        return `<button type="button" class="sky-dot-hit${state.sel === i ? " is-sel" : ""}" data-iv="${i}"
          title="${md(b.t)} ${pad(b.t.getHours())}:00 · ${fmtInt(b.calls)} 次 · ${fmtInt(b.tokens)} token">
          <span class="sky-dot" style="width:${size}px;height:${size}px;background:${bg}"></span></button>`;
      }).join("")}</div>`;
  }).join("");
  return `<div class="sky-grid">${cells}
    <div></div><div class="sky-row" style="height:auto;margin-top:6px">
      ${Array.from({ length: 24 }, (_, h) => `<span style="font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">${h % 3 === 0 ? pad(h) : ""}</span>`).join("")}
    </div></div>`;
}

/**
 * 排布③：30 天 = 日历，只画窗口盖住的那六周。
 *
 * 参照图那版是固定 53 周画布、只点亮窗口内这 30 天。摆在一起比过：本项目这个数据量
 * 下 94% 的格子是灰的，一屏里最大的一块图基本没信息。PO 2026-08-18 裁定收成 30 天
 * 日历——格子放到两倍半大，周末塌陷看得清，代价是没有一年全貌。
 */
function renderCalendar(list, scale) {
  const byKey = new Map(list.map((b, i) => [`${b.t.getFullYear()}-${b.t.getMonth()}-${b.t.getDate()}`, { b, i }]));
  // 画布右端 = 本周周六（这样最后一列是完整的一周），往回数 N 周。
  const end = new Date(NOW); end.setHours(0, 0, 0, 0);
  end.setDate(end.getDate() + (6 - end.getDay()));
  const nWeeks = 6;

  const weeks = [], months = [];
  let lastMonth = -1;
  for (let w = nWeeks - 1; w >= 0; w--) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const day = new Date(end);
      day.setDate(end.getDate() - w * 7 + d - 6);
      days.push(day);
    }
    const col = nWeeks - w;
    // 月份标签打在该月**第一次出现**的那一列。34px 的列距下两个月标不会撞。
    if (days[6].getMonth() !== lastMonth) {
      months.push({ col, label: `${days[6].getMonth() + 1}月` });
    }
    lastMonth = days[6].getMonth();
    weeks.push(days);
  }

  const cells = weeks.map((days) => `<div class="cal-week">${days.map((day) => {
    const hit = byKey.get(`${day.getFullYear()}-${day.getMonth()}-${day.getDate()}`);
    if (!hit) return `<span class="cal-day is-out" title="${md(day)} · 不在这个窗口里"></span>`;
    const lv = scale(hit.b);
    const bg = lv < 0 ? "var(--heat-none)" : `var(--heat-${lv})`;
    return `<button type="button" class="cal-day is-in${state.sel === hit.i ? " is-sel" : ""}" data-iv="${hit.i}"
      style="background:${bg}${lv < 0 ? ";box-shadow:inset 0 0 0 1px var(--line)" : ""}"
      title="${md(day)} · ${fmtInt(hit.b.calls)} 次 · ${fmtInt(hit.b.tokens)} token"></button>`;
  }).join("")}</div>`).join("");

  return `<div class="cal">
    <div></div>
    <div class="cal-months" style="grid-template-columns:repeat(${nWeeks},41px)">
      ${months.map((m) => `<span style="grid-column:${m.col}">${m.label}</span>`).join("")}
    </div>
    <div class="cal-wdays">${["日", "一", "二", "三", "四", "五", "六"]
      .map((w) => `<span>${w}</span>`).join("")}</div>
    <div class="cal-body">${cells}</div>
  </div>`;
}

/* ══ 切片井 ═══════════════════════════════════════════════════════════ */
function renderSlice(list, unit) {
  if (state.sel == null || !list[state.sel]) return "";
  const b = list[state.sel];
  const c = comp(b.tokens);
  const when = unit === "hour"
    ? `${b.t.getMonth() + 1} 月 ${b.t.getDate()} 日 周${WD[b.t.getDay()]} · ${pad(b.t.getHours())}:00 – ${pad(b.t.getHours())}:59`
    : `${b.t.getMonth() + 1} 月 ${b.t.getDate()} 日 周${WD[b.t.getDay()]}`;
  const cacheAll = c.cacheRead + c.cacheWrite;
  const seg = (v) => (b.tokens ? (v / b.tokens) * 100 : 0);
  // 井里**不再列 by model / by key**：下面那张排行列表已经跟着切片走了，
  // 在这里再列一遍就是同一份数据画两遍（口径层 v0.60）。
  return `<div class="slice">
    <div>
      <div class="slice-when">${esc(when)}</div>
      <div class="slice-total"><b class="tnum">${fmt(b.tokens)}</b> <span class="muted">token</span></div>
      <div class="slice-calls">${fmtInt(b.calls)} 次调用${b.errors ? ` · <span class="slice-bad">失败 ${fmtInt(b.errors)}</span>` : ""}</div>
    </div>
    <div>
      <div class="comp-bar">
        <i class="comp-cache" style="width:${seg(cacheAll)}%"></i>
        <i class="comp-in" style="width:${seg(c.netIn)}%"></i>
        <i class="comp-out" style="width:${seg(c.out)}%"></i>
      </div>
      <div class="comp-legend">
        <div><i class="comp-cache"></i>缓存 读 ${fmt(c.cacheRead)} / 写 ${fmt(c.cacheWrite)}<span>${seg(cacheAll).toFixed(0)}%</span></div>
        <div><i class="comp-in"></i>净输入 ${fmt(c.netIn)}<span>${seg(c.netIn).toFixed(0)}%</span></div>
        <div><i class="comp-out"></i>输出 ${fmt(c.out)}<span>${seg(c.out).toFixed(0)}%</span></div>
      </div>
    </div>
    <button type="button" class="slice-x" data-close="1" aria-label="关掉这个切片">×</button>
  </div>`;
}

/**
 * 尖角指向被选中的那一格。按窗口各推一套公式（列宽 × 下标）在三种排布下要写三份，
 * 且日历那两版的列宽还跟着 --cell 变；渲染完直接量一次省事也不会错。
 */
function placeCaret() {
  const sel = document.querySelector("[data-iv].is-sel");
  const well = document.querySelector(".slice");
  if (!sel || !well) return;
  const a = sel.getBoundingClientRect(), b = well.getBoundingClientRect();
  // 夹在井两端之内：选中最左/最右那格时，尖角不该跑到圆角外面去。
  well.style.setProperty("--caret", Math.max(16, Math.min(b.width - 28, a.left + a.width / 2 - b.left - 6)) + "px");
}

/* ══ 排行列表 ═════════════════════════════════════════════════════════ */
const DIM = {
  model: { key: "byModel", unit: "个模型", icon: true, list: MODELS },
  key: { key: "byKey", unit: "把 API Key", icon: false, list: KEYS },
  credential: { key: "byCred", unit: "份上游凭证", icon: false, list: CREDS },
};

function aggregate(scope, dimKey) {
  const agg = {};
  scope.forEach((b) => {
    for (const [k, v] of Object.entries(b[dimKey])) {
      const cur = agg[k] || (agg[k] = { label: k, tokens: 0, calls: 0, errors: 0 });
      cur.tokens += v;
      cur.calls += b.tokens ? Math.round(b.calls * (v / b.tokens)) : 0;
      cur.errors += b.tokens ? Math.round(b.errors * (v / b.tokens)) : 0;
    }
  });
  return Object.values(agg).filter((r) => r.tokens > 0 || r.calls > 0)
    .sort((a, b) => b.tokens - a.tokens || b.calls - a.calls);
}

const rankRows = (scope) => aggregate(scope, DIM[state.dim].key);

/* 颜色跟着**实体**走，不跟名次走：切一个区间名次就会变，按名次上色会让整排
   条同时改色，「蓝的那个」这句话在这一页上就不成立了。所以颜色在这里一次性
   按全量（30 天）的次序钉死，之后无论窗口、切片、维度怎么变都不再动。
   第 6 名及以后并进「其余」，不发第 6 个色相（dataviz：第 9 个系列不是新色相）。 */
const CAT = ["var(--cat-1)", "var(--cat-2)", "var(--cat-3)", "var(--cat-4)", "var(--cat-5)"];
const OTHER_COLOR = "var(--cat-other)";
const OTHER_LABEL = "其余";
const COLOR_OF = {};
for (const [dim, cfg] of Object.entries(DIM)) {
  COLOR_OF[dim] = new Map(
    aggregate(buckets, cfg.key).map((r, i) => [r.label, i < CAT.length ? CAT[i] : OTHER_COLOR]),
  );
}

/** 一段时间的构成：前 5 名各一段，其余合并成一段。 */
function composition(scope, dim) {
  const rows = aggregate(scope, DIM[dim].key).map((r) => ({ ...r, color: COLOR_OF[dim].get(r.label) || OTHER_COLOR }));
  const head = rows.filter((r) => r.color !== OTHER_COLOR);
  const tail = rows.filter((r) => r.color === OTHER_COLOR);
  if (tail.length) {
    head.push({ label: `${OTHER_LABEL}（${tail.length}）`, color: OTHER_COLOR, tokens: tail.reduce((a, r) => a + r.tokens, 0), calls: 0, errors: 0 });
  }
  const total = head.reduce((a, r) => a + r.tokens, 0);
  return { rows: head.filter((r) => r.tokens > 0), total };
}

const catLegend = (rows, total) => `<div class="cat-legend">${rows.map((r) =>
  `<span title="${esc(r.label)} · ${fmtInt(r.tokens)} token"><i style="background:${r.color}"></i><b>${esc(r.label)}</b><em>${((r.tokens / total) * 100).toFixed(0)}%</em></span>`).join("")}</div>`;

/** 环。段间留 3 个路径单位的缝，段界不靠色差自己撑。 */
function renderDonut(rows, total) {
  const R = 62, SW = 20, C = 2 * Math.PI * R, GAP = 3.5;
  let acc = 0;
  const arcs = rows.map((r) => {
    const share = r.tokens / total;
    const len = Math.max(1, share * C - GAP);
    const el = `<circle r="${R}" cx="0" cy="0" fill="none" stroke="${r.color}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}">
      <title>${esc(r.label)} · ${fmtInt(r.tokens)} token · ${(share * 100).toFixed(1)}%</title></circle>`;
    acc += share * C;
    return el;
  }).join("");
  return `<div class="donut-wrap">
    <svg viewBox="-76 -76 152 152" role="img" aria-label="按模型的 token 构成">
      <g transform="rotate(-90)">${arcs}</g>
    </svg>
    <div class="donut-mid"><b>${fmt(total)}</b><span>TOKEN</span></div>
  </div>`;
}

/** 堆叠条。参照图底下那两条（BY MODEL / BY MEMBER）。 */
function renderStack(rows, total) {
  return `<div class="stack">${rows.map((r) =>
    `<i style="width:${((r.tokens / total) * 100).toFixed(2)}%;background:${r.color}"
        title="${esc(r.label)} · ${fmtInt(r.tokens)} token"></i>`).join("")}</div>
    ${catLegend(rows, total)}`;
}

function renderRank(scope) {
  const rows = rankRows(scope);
  const total = rows.reduce((a, r) => a + r.tokens, 0);
  const d = DIM[state.dim];
  const iconOf = (name) => (MODELS.find((m) => m.name === name) || {}).ic || name.slice(0, 2).toUpperCase();
  return `
    <div class="rank-scope">
      <div class="rank-scope-note">${state.sel != null ? "只看选中的那个区间。再点一次或按 Esc 回到整窗。" : `这 ${state.days} 天全部。`}</div>
      <div class="segmented" role="group" aria-label="聚合维度">
        ${Object.entries(DIM).map(([k, v]) => `<button type="button" class="segment${state.dim === k ? " is-on" : ""}" data-dim="${k}">${k === "model" ? "按模型" : k === "key" ? "按 API Key" : "按上游凭证"}</button>`).join("")}
      </div>
    </div>
    ${rows.length === 0 ? `<p class="muted" style="padding:14px 0">这段时间还没有调用。</p>` : `
    <ol class="rank-list">${rows.map((r, i) => `
      <li class="rank-row">
        <span class="rank-no tnum">${i + 1}</span>
        ${d.icon ? `<span class="rank-icon" aria-hidden="true">${esc(iconOf(r.label))}</span>` : ""}
        <div class="rank-main">
          <code class="rank-label" title="${esc(r.label)}">${esc(r.label)}</code>
          <div class="sub">${fmtInt(r.calls)} 次调用${r.errors ? ` · <span class="rank-bad">失败 ${fmtInt(r.errors)}</span>` : ""}</div>
        </div>
        <div class="rank-metric">
          <span class="rank-metric-value tnum">${fmt(r.tokens)}</span><span class="rank-metric-unit">token</span>
          <div class="sub tnum">${total ? ((r.tokens / total) * 100).toFixed(1) + "%" : "—"}</div>
        </div>
      </li>`).join("")}</ol>`}`;
}

/* ══ 整页 ═════════════════════════════════════════════════════════════ */
function render() {
  const { unit, list } = intervals(state.days);
  const s = ivStats(list);
  const scale = heatScale(list);
  const unitWord = unit === "hour" ? "小时" : "天";
  const first = list[0].t, last = list[list.length - 1].t;
  const range = unit === "hour" && state.days === 1
    ? `${md(first)} ${pad(first.getHours())}:00 起的 24 小时`
    : `${md(first)} – ${md(last)}`;
  const peakWhen = unit === "hour" ? `${md(s.peak.t)} ${pad(s.peak.t.getHours())} 时` : md(s.peak.t);
  // 选了区间就只看那一段——环、堆叠条、排行列表三处必须看同一个 scope，
  // 否则同一屏上会出现「上面是整窗、下面是这一小时」两套数。
  const scope = state.sel != null && list[state.sel] ? [list[state.sel]] : list;
  const byModel = composition(scope, "model");
  const byKey = composition(scope, "key");
  // 柱靠高度说话，其余两档靠深浅；色阶图例只在后者出现。
  const usesHeat = state.days !== 1;
  const body = state.days === 1
    ? renderBars(list, scale, { label: (b) => `${pad(b.t.getHours())}:00`, every: 3 })
    : state.days === 7 ? renderMatrix(list, scale)
    : renderCalendar(list, scale);

  document.getElementById("page").innerHTML = `
    <header class="page-head">
      <h1>排行</h1>
      <div class="segmented" role="group" aria-label="统计窗口">
        ${[1, 7, 30].map((d) => `<button type="button" class="segment${state.days === d ? " is-on" : ""}" data-days="${d}">${d} 天</button>`).join("")}
      </div>
    </header>

    <!-- 指标条：一条有主次的行。这个合计同时是下面每一行占比的分母。 -->
    <div class="stats">
      <div class="stat-lead">
        <span class="stat-lead-value">${fmt(s.total)}</span>
        <span class="stat-lead-label">token 合计 · 这 ${state.days} 天</span>
      </div>
      <div class="stat-tokens">
        <span>活跃区间 <b>${s.activeN}/${s.n}</b> 个${unitWord}</span>
        <span>峰值 <b>${fmt(s.peak.tokens)}</b> · ${peakWhen}</span>
      </div>
    </div>

    <section class="sky" aria-label="节律">
      <div class="sky-head">
        <div>${esc(range)} · 一格 = 1 ${unitWord}</div>
        ${usesHeat ? `<div class="sky-legend">
          <span>少</span>
          <i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i>
          <i style="background:var(--heat-3)"></i><i style="background:var(--heat-4)"></i>
          <span>多</span>
        </div>` : ""}
      </div>
      <!-- 环这一栏不带图例（PO 2026-08-18 裁）：名字和百分比由下面那条 BY MODEL
           堆叠条给，同一屏、同一套颜色、同一个 scope，两块隔着一条分隔线。
           dataviz「≥ 2 个系列必须有图例、身份不能只靠颜色」由那条满足。 -->
      <div class="sky-split">
        <div>${byModel.total ? renderDonut(byModel.rows, byModel.total)
          : `<div class="sky-hint" style="margin:0">这段时间还没有调用。</div>`}</div>
        <div>${body}</div>
      </div>
      <p class="sky-hint">点一格，看那一段是谁在烧。</p>
      ${renderSlice(list, unit)}

      <!-- 参照图底下那两条。「BY MEMBER」在单人网关里没有对应物，
           最近的是「按 API Key」——它答的是「哪个客户端在烧」。 -->
      ${byModel.total ? `<div class="breakdown">
        <div><div class="cat-title">按模型</div>${renderStack(byModel.rows, byModel.total)}</div>
        <div><div class="cat-title">按 API Key</div>${renderStack(byKey.rows, byKey.total)}</div>
      </div>` : ""}

      <!-- 五个统计量全部从同一个桶数组算出来，一套文案吃三种窗口。 -->
      <dl class="ivstats">
        <div class="ivstat"><dt>合计</dt><dd>${fmt(s.total)}</dd></div>
        <div class="ivstat"><dt>每${unitWord}均值</dt><dd>${fmt(s.avg)}</dd></div>
        <div class="ivstat"><dt>峰值区间</dt><dd>${fmt(s.peak.tokens)}<small>${peakWhen}</small></dd></div>
        <div class="ivstat"><dt>活跃区间</dt><dd>${s.activeN}<small>共 ${s.n} 个${unitWord}</small></dd></div>
        <div class="ivstat"><dt>最长连续</dt><dd>${s.streak}<small>连着 ${s.streak} 个${unitWord}有调用</small></dd></div>
      </dl>
    </section>

    ${renderRank(scope)}

    <div class="notes">
      <h3>这份样稿要你看的三件事</h3>
      <ul>
        <li><b>7 天那张点阵好不好读</b>——尺寸 + 深浅双编码，一眼能不能看出「几点在烧」。切到 <code>7 天</code> 看。</li>
        <li><b>30 天这张日历</b>——只画窗口盖住的那六周（PO 2026-08-18 裁：53 周画布下 94% 的格子是灰的）。切到 <code>30 天</code> 看格子大小、周末塌陷读不读得出来。</li>
        <li><b>热度用墨色单色 5 档</b>（DESIGN §4「单色是默认态」），参照图用蓝。要换成一个数据色相，只改 <code>--heat-0…4</code> 五个变量。</li>
      </ul>
      <h3>与参照图刻意不同的地方</h3>
      <ul>
        <li>30 天不放环形图，日历占满整宽（参照图在 30d 那屏也是这样）。</li>
        <li>没有两张等大数字卡：压成一条有主次的指标行（DESIGN §9「指标堆砌成一排等大方块」）。</li>
        <li>切片井里没有 by model / by key：排行列表本来就跟着切片走，井只答「这一段花在哪种 token 上」。</li>
        <li>构成条是<b>缓存 / 净输入 / 输出</b>三段，不列 reasoning（口径层 v0.66：思考在 output 里面，单列会被读成第四笔加数）；净输入 = 毛值 − 缓存两项（v0.71）。</li>
        <li>没有费用、没有逐模型曲线（PO 2026-08-18 两裁「不做」）。</li>
      </ul>
    </div>`;

  placeCaret();
}

/* ══ 交互 ═════════════════════════════════════════════════════════════ */
document.getElementById("page").addEventListener("click", (e) => {
  const days = e.target.closest("[data-days]");
  if (days) { state.days = Number(days.dataset.days); state.sel = null; return render(); }
  const dim = e.target.closest("[data-dim]");
  if (dim) { state.dim = dim.dataset.dim; return render(); }
  if (e.target.closest("[data-close]")) { state.sel = null; return render(); }
  const iv = e.target.closest("[data-iv]");
  if (iv) {
    const i = Number(iv.dataset.iv);
    state.sel = state.sel === i ? null : i;      // 再点一次取消
    return render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sel != null) { state.sel = null; render(); }
});

render();
</script>


</body><div id="immersive-translate-browser-popup" style="all: initial"></div></html>
