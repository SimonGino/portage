<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portage · 工作台</title>
<!--
  方向 A-v2 · Grok 港改成网关工作台

  假设：视觉 = A（纸灰 248 左栏、白画布大圆角、Outfit / IBM Plex Sans / IBM Plex Mono、
  选中浅底药丸、主按钮实心黑胶囊、几乎无边框靠 --sunken）。
  交互 = 现网关工作台（清单 / 定高表 / 模型列表上方展开井 / 居中工作表）。
  聊天壳已剥掉：无胶囊对话、无底栏输入槽、无右对齐限定名气泡、探测不是助手回复。

  对照 brief 已覆盖：
  - 五项导航，默认模型页，无概览；账号钉左栏底（改密码 / 退出）
  - 左栏中段只在模型页：渠道搜索 + 列表 + 新建渠道
  - 模型页：渠道名 + 立即启停；主按钮「获取模型列表」；「上游设置 / 上游凭证」展开井（默收）
  - 模型行：裸名等宽左对齐、限定名可复制（停用不可复制）、协议子集、启停、删除二次确认
  - 获取模型弹层：搜索、显示已纳管、分组勾选、全选只作用于当前可见、确认纳管；含未纳管样例
  - 上游设置井：渠道名禁 /、协议（Gemini 置灰暂未支持）、Base URL + 逐协议脱敏预览、
    并发上限空=不限、勾 Responses 才出 Codex 压缩、脏了才可保存 + 已保存回执、
    删除渠道二次确认并写「该渠道被 N 个接入点引用」
  - 新建渠道：主区整页即该表 + 一份凭证，无模型列表
  - 上游凭证井：与 API Key 两回事；名 ghost、值掩码、显示/复制/启停/删除；
    已摘 · 401 + 时刻、只人工恢复；≥2 把出轮询/随机；段旁「检测」按凭证分行；
    模型矩阵通/不通/说不清有文字；添加：名+值+显示+添加
  - API Key 表：掩码/显示/复制、空串「原值没存过，只能删了重建」、白名单 * =不限、
    创建时间、启停、编辑、删除；新建/编辑弹层（不限或多选接入点名+限定名）；
    生成后再弹全串+复制，不写「关掉就再也看不到」
  - 调用记录：定高 9 列（时间/API Key/模型主副/端点入站上游/类型/上游凭证/状态+错词+重试+详情/耗时+首字/in out+思考+缓存）；
    模型下拉、只看失败、刷新；右下页码可跳；详情仅 request-id 或 ≥400；原文只在失败行
  - 接入点表：名可复制、候选渠道/模型+权重、状态、编辑删除；空态两句；新建/编辑弹层
  - 排行：按模型/API Key/上游凭证 × 1/7/30 天；一个合计作占比分母；无名热门/份额/环比/费用
  - 船体标记 path 原样；样例数据沿用 SPEC
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3f3f1;
    --canvas: #ffffff;
    --ink: #161615;
    --ink-2: #3c3c38;
    --mute: #5e5e59;
    --faint: #6f6f6a;
    --line: #e6e6e2;
    --sunken: #e8e8e4;
    --chip: #efefe9;
    --hover: rgba(22, 22, 21, 0.045);
    --shadow: 0 18px 48px rgba(22, 22, 21, 0.08);
    --r: 20px;
    --r-sm: 16px;
    --side: 248px;
    --display: "Outfit", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    --sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    display: flex;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    text-wrap: pretty;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  input, textarea, select { border: 0; background: transparent; outline: none; }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  ::selection { background: var(--ink); color: var(--paper); }

  /* —— 左栏 —— */
  .rail {
    width: var(--side);
    flex: 0 0 var(--side);
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 18px 12px 14px;
    min-height: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px 18px;
  }
  .brand svg { width: 22px; height: 22px; display: block; flex: 0 0 22px; }
  .brand b {
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.03em;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    text-align: left;
  }
  .nav button svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: 0.72; }
  .nav button:hover { background: var(--hover); }
  .nav button.is-on {
    background: var(--sunken);
    color: var(--ink);
    font-weight: 500;
  }
  .nav button.is-on svg { opacity: 1; }

  .rail-mid {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-top: 22px;
    overflow: auto;
  }
  .rail-label {
    padding: 0 12px 8px;
    color: var(--faint);
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .rail-search {
    margin: 0 8px 8px;
    width: calc(100% - 16px);
    background: var(--sunken);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
  }
  .rail-search::placeholder { color: var(--faint); }
  .rail-list { display: flex; flex-direction: column; gap: 2px; }
  .rail-list button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    border-radius: var(--r-sm);
    text-align: left;
    color: var(--ink-2);
    min-height: 38px;
  }
  .rail-list button:hover { background: var(--hover); }
  .rail-list button.is-on { background: var(--sunken); color: var(--ink); font-weight: 500; }
  .rail-list .nm {
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rail-list .mark { font-size: 12px; color: var(--mute); flex: 0 0 auto; }
  .rail-list button.is-off .nm { color: var(--faint); }
  .rail-new {
    margin: 8px 8px 0;
    width: calc(100% - 16px);
    padding: 8px 12px;
    border-radius: 12px;
    text-align: left;
    color: var(--mute);
    font-size: 13px;
  }
  .rail-new:hover { background: var(--hover); color: var(--ink); }
  .rail-new.is-on { background: var(--sunken); color: var(--ink); font-weight: 500; }

  .account { padding: 10px 8px 4px; display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--sunken);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: -0.03em;
  }
  .who strong { display: block; font-weight: 500; font-size: 14px; }
  .who span { display: block; color: var(--mute); font-size: 12px; }
  .acct-acts { display: flex; gap: 4px; padding: 0 4px; }
  .acct-acts button {
    color: var(--mute); font-size: 13px; padding: 6px 8px; border-radius: 12px;
  }
  .acct-acts button:hover { background: var(--hover); color: var(--ink); }

  /* —— 主画布 —— */
  .stage {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: var(--canvas);
    border-radius: 24px 0 0 24px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .scroll.is-fill { overflow: hidden; display: flex; flex-direction: column; }
  .scroll.is-fill #root {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    max-width: none; padding: 36px 28px 20px;
  }
  #root {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 36px 48px;
    width: 100%;
  }
  #root.is-wide { max-width: 1240px; }
  #root.is-fill {
    max-width: none;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: -0.035em;
    text-wrap: pretty;
  }
  .lede {
    margin: 10px 0 0;
    color: var(--mute);
    font-size: 15px;
    max-width: 40em;
  }
  .lede code { font-size: 0.92em; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: var(--r);
    padding: 14px 22px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 16px;
    letter-spacing: -0.02em;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn-hero {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 26px;
    font-size: 17px;
    border-radius: 22px;
  }
  .btn-hero:hover:not(:disabled) { background: #2a2a27; }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 16px;
  }
  .btn-primary:hover:not(:disabled) { background: #2a2a27; }
  .btn-ghost {
    background: var(--chip);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 14px;
    border-radius: 14px;
  }
  .btn-ghost:hover:not(:disabled) { background: var(--sunken); }
  .btn-ghost.is-on { background: var(--sunken); font-weight: 500; }
  .btn-text {
    color: var(--mute);
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .btn-text:hover:not(:disabled) { color: var(--ink); }
  .btn-text.is-on { color: var(--ink); font-weight: 500; }
  .btn-danger { color: var(--ink-2); }

  .ch-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 28px 0 6px;
    flex-wrap: wrap;
  }
  .ch-id { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .ch-id h2 {
    margin: 0;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.03em;
  }
  .ch-id.is-off h2 { color: var(--faint); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 12px;
    color: var(--mute);
    background: var(--chip);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .tag-warn { background: var(--sunken); color: var(--ink-2); }
  .tag-off { color: var(--faint); }
  .ch-acts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .well-toggle.is-on { color: var(--ink); font-weight: 500; }

  .bar {
    margin: 12px 0 0;
    padding: 12px 14px;
    background: var(--paper);
    border-radius: 14px;
    font-size: 14px;
    color: var(--ink-2);
  }

  .well {
    margin: 14px 0 8px;
    background: var(--sunken);
    border-radius: 20px;
    padding: 18px 20px 20px;
  }
  .well-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .well-head h3 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.03em;
  }
  .well-head .row-actions { display: flex; align-items: center; gap: 8px; }
  .well .hint, .hint { color: var(--mute); font-size: 13px; margin: 0 0 12px; }
  .well .field input,
  .well .field textarea,
  .sheet .field input,
  .sheet .field textarea {
    background: var(--canvas);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--mute); }
  .field input, .field textarea, .field .fake-input {
    width: 100%;
    background: var(--paper);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 15px;
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .field input:focus, .field textarea:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .field-hint { color: var(--faint); font-size: 12.5px; }
  .field-error { color: var(--ink); font-size: 13px; }

  .url-preview {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 4px 0 14px;
    padding: 10px 12px;
    background: var(--paper);
    border-radius: 14px;
  }
  .url-preview div { font-size: 13px; }
  .url-preview code { font-size: 12.5px; word-break: break-all; }

  .seg, .windows {
    display: inline-flex;
    gap: 4px;
    background: var(--paper);
    padding: 4px;
    border-radius: 14px;
    flex-wrap: wrap;
  }
  .well .seg { background: var(--canvas); }
  .seg button, .windows button {
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .seg button.is-on, .windows button.is-on {
    background: var(--canvas);
    color: var(--ink);
    font-weight: 500;
  }
  .well .seg button.is-on { background: var(--sunken); }
  .seg button.is-soon {
    opacity: 0.42;
    cursor: not-allowed;
    color: var(--faint);
  }
  .seg button.is-soon small { display: block; font-size: 10px; letter-spacing: 0; }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin: 4px 0 12px;
  }
  .check input { width: 15px; height: 15px; accent-color: var(--ink); }

  .sw {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .sw i {
    width: 36px; height: 22px; border-radius: 999px;
    background: var(--ink); position: relative; display: inline-block;
    transition: background 0.15s ease;
  }
  .sw i::after {
    content: "";
    position: absolute; top: 3px; left: 17px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--canvas);
    transition: left 0.15s ease;
  }
  .sw.is-off { color: var(--mute); }
  .sw.is-off i { background: #c9c9c3; }
  .sw.is-off i::after { left: 3px; }

  /* —— 模型清单 —— */
  .mlist { display: flex; flex-direction: column; margin-top: 10px; }
  .mrow {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 20px;
    padding: 16px 12px 15px;
    border-radius: var(--r-sm);
    align-items: start;
    text-align: left;
  }
  .mrow:hover { background: var(--hover); }
  .mrow.is-off .m-name, .mrow.is-off .m-q { color: var(--faint); }
  .m-name {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.25;
  }
  .m-q {
    grid-column: 1;
    color: var(--mute);
    font-size: 13.5px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: center;
  }
  .m-q button.qcopy {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--mute);
    padding: 0;
    border-radius: 4px;
  }
  .m-q button.qcopy:hover { color: var(--ink); }
  .m-side {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 2px;
  }
  .proto-row {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .proto-row .lbl { font-size: 12px; color: var(--faint); }
  .chip-toggle {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--chip);
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .chip-toggle.is-on { background: var(--ink); color: var(--paper); }
  .chip-toggle.is-stale { background: var(--sunken); text-decoration: line-through; color: var(--faint); }

  .add-models {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    padding: 8px 12px 0;
    align-items: center;
  }
  .add-models input {
    flex: 1;
    background: var(--paper);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14px;
  }
  .add-models input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }

  /* —— 凭证 —— */
  .cred {
    display: grid;
    grid-template-columns: 140px 1fr auto auto;
    gap: 8px 12px;
    align-items: center;
    padding: 10px 0;
  }
  .cred + .cred { box-shadow: inset 0 1px 0 var(--line); }
  .ghost-input {
    background: transparent;
    border-radius: 8px;
    padding: 6px 8px;
    font-weight: 500;
    width: 100%;
  }
  .ghost-input:hover, .ghost-input:focus { background: var(--canvas); }
  .cred-val { font-family: var(--mono); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .cred-state { font-size: 13px; color: var(--mute); }
  .cred-acts { display: flex; align-items: center; gap: 4px; }
  .cred-add {
    display: grid;
    grid-template-columns: 140px 1fr auto auto;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .cred-add input {
    background: var(--canvas);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .cred-add input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }

  .probe { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
  .probe + .probe { margin-top: 8px; }
  .probe ul { margin: 6px 0 0; padding: 0 0 0 1.1em; }
  .probe li { margin: 3px 0; }
  .probe-grid { margin-top: 14px; }
  .probe-model {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 10px;
    padding: 8px 0;
  }
  .pcell {
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--paper);
  }

  /* —— 表 —— */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin: 18px 0 10px;
    flex-wrap: wrap;
  }
  .toolbar-left { margin-right: auto; color: var(--mute); font-size: 14px; }
  select.pick {
    background: var(--paper);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 14px;
    min-width: 180px;
  }

  .table-wrap { overflow: auto; }
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.data th {
    text-align: left;
    font-weight: 500;
    color: var(--faint);
    font-size: 12px;
    padding: 0 12px 10px;
    white-space: nowrap;
  }
  table.data td {
    padding: 12px;
    vertical-align: top;
  }

    try {
      const u = new URL(url);
      const parts = u.host.split(".");
      let host = u.host;
      if (parts.length >= 3) {
        const mid = parts[1];
        const keep = Math.min(4, Math.max(2, mid.length - 1));
        host = parts[0] + "." + mid.slice(0, keep) + "****" + "." + parts[parts.length - 1];
      } else if (parts.length === 2) {
        host = parts[0].slice(0, 3) + "****." + parts[1];
      }
      const path = u.pathname === "/" ? "" : u.pathname.replace(/\/+$/, "");
      return u.protocol + "//" + host + path;
    } catch {
      return "****";
    }
  }

  function filteredLogs() {
    return LOGS.filter((l) => {

    });
  }

  function pageList(cur, count) {
    const WINDOW = 5;
    if (count <= WINDOW + 2) return Array.from({ length: count }, (_, i) => i);
    const start = Math.max(1, Math.min(cur - 2, count - 1 - WINDOW));
    const end = start + WINDOW;
    const out = [0];
    if (start === 2) out.push(1);
    else if (start > 1) out.push("gap");
    for (let i = start; i < end; i++) out.push(i);
    if (end === count - 2) out.push(end);
    else if (end < count - 1) out.push("gap");
    out.push(count - 1);
    return out;
  }

  function openPicker() {
    const ch = chBy(state.channel);
    if (!ch) return;
    state.pick = {
      loading: true,
      failed: false,
      query: "",
      showManaged: false,
      picked: {},
      expanded: {},
      names: [],
    };
    renderModal();
    setTimeout(() => {
      if (!state.pick) return;
      state.pick.loading = false;
      state.pick.names = (ch.fetched || []).slice();
      renderModal();
    }, 380);
  }

  function pickVisible() {
    const ch = chBy(state.channel);
    const p = state.pick;
    const existing = new Set(modelsOf(ch.id).map((m) => m.name));
    const q = p.query.trim().toLowerCase();
    return p.names
      .filter((n) => (p.showManaged || !existing.has(n)) && (!q || n.toLowerCase().includes(q)))
      .sort((a, b) => a.localeCompare(b));
  }

  function pickGroups(visible) {
    const by = new Map();
    for (const n of visible) {
      const f = familyOf(n);
      by.set(f, [...(by.get(f) || []), n]);
    }
    const out = [];
    const other = [];
    for (const [name, items] of by) {
      if (items.length === 1) other.push(...items);
      else out.push({ name, items });
    }
    out.sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name));
    if (other.length) out.push({ name: "其它", items: other.sort((a, b) => a.localeCompare(b)) });
    return out;
  }

  function pickHTML() {
    const ch = chBy(state.channel);
    const p = state.pick;
    const existing = new Set(modelsOf(ch.id).map((m) => m.name));
    if (p.loading) {
      return `<h2>获取并挑选模型：${esc(ch.name)}</h2>
        <p class="mpick-note">拉取中…朝勾选的协议侧各请求一次上游 /v1/models。</p>`;
    }
    if (p.failed) {
      return `<h2>获取并挑选模型：${esc(ch.name)}</h2>
        <p class="mpick-note">拉取失败——上游没有 /v1/models 是常事，可以关掉手填，或重试。</p>
        <div class="sheet-acts"><button type="button" class="btn btn-ghost" data-act="pick-reload">重新拉取</button></div>`;
    }
    const visible = pickVisible();
    const groups = pickGroups(visible);
    const pickable = visible.filter((n) => !existing.has(n));
    const pickedN = Object.keys(p.picked).filter((n) => p.picked[n]).length;
    const allPicked = pickable.length > 0 && pickable.every((n) => p.picked[n]);
    const total = p.names.length;
    const managed = p.names.filter((n) => existing.has(n)).length;
    const q = p.query.trim();
    return `
      <h2>获取并挑选模型：${esc(ch.name)}</h2>
      <p class="mpick-note">上游列出 ${total} 个，其中 ${managed} 个已纳管。这份列表只用来帮你填表，不落库、不影响路由——中转站把没有的模型也写进列表是常事，勾之前最好确认它真的能调通。</p>
      <div class="mpick-bar">
        <input class="mpick-search" id="pick-q" placeholder="搜模型名，比如 qwen3 或 haiku" value="${esc(p.query)}" />
        <button type="button" class="btn btn-ghost ${p.showManaged ? "is-on" : ""}" data-act="pick-managed">显示已纳管</button>
        <button type="button" class="btn btn-ghost" data-act="pick-reload">重新拉取</button>
        <button type="button" class="btn btn-ghost" data-act="pick-all" ${pickable.length ? "" : "disabled"}>${allPicked ? "取消这 " + pickable.length + " 个" : "全选可见的 " + pickable.length + " 个"}</button>
      </div>
      <div class="mpick-list">
        ${visible.length === 0 ? `<div class="empty">${q ? "没有匹配「" + esc(p.query) + "」的模型。" : "上游列出的都已经纳管了。"}</div>` : groups.map((g, gi) => {
          const open = q !== "" || p.expanded[g.name] !== false && (gi === 0 || p.expanded[g.name] || g.items.length <= 12);
          const free = g.items.filter((n) => !existing.has(n));
          const on = free.filter((n) => p.picked[n]).length;
          return `<div class="mpick-group">
            <div class="mpick-group-head">
              <button type="button" class="mpick-group-name" data-pick-group="${esc(g.name)}">${open ? "▾" : "▸"} ${esc(g.name)}<span class="muted">${g.items.length}</span></button>
              ${on ? `<span class="tag">已选 ${on}</span>` : ""}
              ${free.length ? `<button type="button" class="btn-text" data-pick-galli="${esc(g.name)}">${on < free.length ? "全选" : "全不选"}</button>` : ""}
            </div>
            ${open ? g.items.map((name) => {
              const has = existing.has(name);
              return `<label class="mpick-row ${has ? "is-off" : ""}">
                <input type="checkbox" data-pick-one="${esc(name)}" ${has || p.picked[name] ? "checked" : ""} ${has ? "disabled" : ""} />
                <code>${esc(name)}</code>
                ${ch.protocols.length > 1 ? ch.protocols.map((pr) => `<span class="tag">${esc(PROTO[pr].short)}</span>`).join("") : ""}
                ${has ? `<span class="tag tag-off">已纳管</span>` : ""}
              </label>`;
            }).join("") : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="sheet-acts">
        <span class="muted">${pickedN ? "已选 " + pickedN + " 个" : "还没选"}</span>
        <button type="button" class="btn btn-ghost" data-act="modal-close">取消</button>
        <button type="button" class="btn btn-primary" data-act="pick-add" ${pickedN ? "" : "disabled"}>添加 ${pickedN} 个</button>
      </div>`;
  }

  function whitelistOptions() {
    const aps = APS.filter((a) => !a.disabled).map((a) => a.name);
    const qs = CHANNELS.filter((c) => !c.disabled).flatMap((c) =>
      modelsOf(c.id).filter((m) => !m.disabled).map((m) => qname(c.name, m.name))
    );
    return [...aps, ...qs];
  }

  function keyFormHTML() {
    const f = state.keyForm;
    const editing = !!f.id;
    const opts = whitelistOptions();
    return `
      <h2>${editing ? "编辑 API Key：" + esc(f.name) : "新建 API Key"}</h2>
      <p class="lede">白名单写接入点名或纳管模型限定名。逐项精确匹配，不支持通配。</p>
      <div class="field">
        <label>名称</label>
        <input id="kf-name" value="${esc(f.name)}" placeholder="会出现在调用流水里" />
      </div>
      <div class="field">
        <label>可访问模型</label>
        <label class="check"><input type="checkbox" id="kf-unlim" ${f.unlimited ? "checked" : ""} /> 不限（所有可路由的模型）</label>
        ${f.unlimited ? "" : `
          <div class="chips" style="margin-bottom:8px">
            ${f.picked.map((m) => `<span class="chip"><code>${esc(m)}</code><button type="button" class="x" data-kf-rm="${esc(m)}">×</button></span>`).join("")}
          </div>
          ${f.picked.length === 0 ? `<span class="field-hint">一个都不选等于不限——后端把空白名单当作 *。</span>` : ""}
          <div class="suggest-list">

          </div>`}
      </div>
      ${editing ? `<label class="check"><input type="checkbox" id="kf-off" ${f.disabled ? "checked" : ""} /> 停用这把 API Key</label>` : ""}
      <div class="sheet-acts">
        <button type="button" class="btn btn-ghost" data-act="modal-close">取消</button>
        <button type="button" class="btn btn-primary" data-act="key-save" ${f.name.trim() ? "" : "disabled"}>${editing ? "保存" : "生成"}</button>
      </div>`;
  }

    const groups = CHANNELS.filter((c) => !c.disabled).map((c) => ({
      name: c.name,
      items: modelsOf(c.id).filter((m) => !m.disabled),
    })).filter((g) => g.items.length);
    return `
      <h2>${f.id ? "编辑接入点：" + esc(f.name) : "新建接入点"}</h2>
      <p class="lede">M0~M2 每个接入点一个候选。权重在多候选放开后才有用。</p>

        <label>接入点名</label>
        <input id="ap-name" value="${esc(f.name)}" placeholder="客户端 model 字段填的就是这个" />

      <div class="field">
        <label>候选（渠道 / 纳管模型）</label>
        <div class="cand-groups">
          ${groups.map((g) => `
            <div>
              <div class="cand-g">${esc(g.name)}</div>

      <div class="sheet-acts">
        <button type="button" class="btn btn-ghost" data-act="modal-close">取消</button>
        <button type="button" class="btn btn-primary" data-act="ap-save" ${f.name.trim() && f.model ? "" : "disabled"}>保存</button>
      </div>`;

  function logDetailHTML() {
    const l = LOGS.find((x) => x.id === state.logDetail);
    if (!l) return "";
    const rid = l.rid
      ? `<button type="button" class="btn-text" data-copy="${esc(l.rid)}" data-copy-label="request-id"><code>${esc(l.rid)}</code></button>`
      : "—";
    return `
      <h2>调用详情</h2>
      <p class="lede">${esc(l.time)}</p>
      <dl class="dl">
        <dt>模型</dt>
        <dd><code>${esc(l.req)}</code> <span class="sub">→ ${l.ch ? esc(l.ch + " / " + l.up) : "—"}</span></dd>
        <dt>端点</dt>
        <dd class="mono">${esc(l.cin)} → ${l.cup ? esc(l.cup) : "—"}</dd>
        <dt>状态</dt>
        <dd><span class="pill">${l.status}</span>${l.retry ? " 重试 ×" + l.retry : ""}${l.err ? " · " + esc(l.err) : ""}</dd>
        <dt>上游 request-id</dt>
        <dd>${rid}</dd>
      </dl>
      ${l.status >= 400 ? `<pre class="err-pre">${esc(l.detail || "上游没有返回任何响应体。")}</pre>` : ""}`;
  }

  /* —— 读表单草稿（不整页重绘） —— */
  function readSettingsFromDom() {
    if (!state.draft) return;
    const name = $("#set-name");
    const base = $("#set-base");
    const conc = $("#set-conc");
    const cred = $("#set-cred");
    if (name) state.draft.name = name.value;
    if (base) state.draft.base_url = base.value;
    if (conc) state.draft.max_concurrency = conc.value;
    if (cred) state.draft.credential = cred.value;
  }

  function refreshSettingsChrome() {
    const active = document.activeElement;
    const focusId = active && active.id;
    const pos = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    readSettingsFromDom();
    const root = $("#root");
    if (!root) return;
    if (state.creating) {
      root.innerHTML = renderModels();
    } else {
      const well = root.querySelector(".well");
      if (!well || state.well !== "settings") return;
      const ch = chBy(state.channel);
      well.innerHTML = `<div class="well-head"><h3>上游设置</h3></div>${settingsForm(ch, state.draft)}`;
    }
    if (focusId) restoreField(focusId, pos);
  }

  function saveChannel() {
    readSettingsFromDom();
    const ch = chBy(state.channel);
    const d = state.draft;
    if (!ch || !d || d.name.includes("/")) return;
    const renamed = ch.name !== d.name.trim();
    const oldName = ch.name;
    ch.name = d.name.trim();
    ch.protocols = d.protocols.slice();
    ch.base_url = d.base_url.trim();
    ch.max_concurrency = parseInt(d.max_concurrency, 10) > 0 ? parseInt(d.max_concurrency, 10) : 0;
    if (d.protocols.includes("openai_responses")) ch.supports_compaction = !!d.supports_compaction;
    if (renamed) {
      APS.forEach((a) => { if (a.channel === oldName) a.channel = ch.name; });
    }
    state.draft = Object.assign({ id: ch.id }, emptyDraft(ch));
    state.savedFlash = true;
    render();
    setTimeout(() => { state.savedFlash = false; if (state.well === "settings") render(); }, 2000);
  }

  function createChannel() {
    readSettingsFromDom();
    const d = state.draft;
    if (!d || !d.name.trim() || d.name.includes("/") || !d.credential) return;
    const id = d.name.trim().toLowerCase().replace(/\s+/g, "-");
    if (chBy(id) || CHANNELS.some((c) => c.name === d.name.trim())) {
      toast("这个渠道名已经有了");
      return;
    }
    CHANNELS.push({
      id,
      name: d.name.trim(),
      disabled: false,
      protocols: d.protocols.slice(),
      base_url: d.base_url.trim(),
      max_concurrency: parseInt(d.max_concurrency, 10) > 0 ? parseInt(d.max_concurrency, 10) : 0,
      supports_compaction: !!d.supports_compaction,
      key_mode: "polling",
      fetched: [],
    });
    CREDS.push({
      id: nextId("c"),
      channel: id,
      name: "凭证 1",
      value: d.credential,
      mask: d.credential.slice(0, 6) + "…" + d.credential.slice(-4),
      disabled: false,
      created: "2026-08-16",
      reason: "",
      when: "",
    });
    state.creating = false;
    state.channel = id;
    state.draft = null;
    state.well = null;
    toast("渠道已创建");
    render();
  }

  function addModelsFromText(raw) {
    const ch = chBy(state.channel);
    const existing = new Set(modelsOf(ch.id).map((m) => m.name));
    const names = Array.from(new Set(String(raw).split(/[\s,，、]+/).map((s) => s.trim()).filter(Boolean)));
    const fresh = names.filter((n) => !existing.has(n));
    fresh.forEach((n) => MODELS.push({ id: nextId("m"), channel: ch.id, name: n, disabled: false, protocols: [] }));
    state.addModel = "";
    if (fresh.length) toast("已纳管 " + fresh.length + " 个");
    else toast("没有新的名字");
    render();
  }

  /* —— 事件 —— */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, [data-nav], label.mpick-row");
    if (!t) {
      if (e.target.id === "modal-scrim") { closeModal(); render(); }
      return;
    }
    if (t.dataset.nav) { showPage(t.dataset.nav); return; }
    if (t.dataset.ch) {
      state.creating = false;
      state.channel = t.dataset.ch;
      state.well = null;
      state.draft = null;
      state.addCred = { name: "", value: "", show: false };
      render();
      return;
    }
    if (t.dataset.copy) { copy(t.dataset.copy, t.dataset.copyLabel); return; }
    if (t.dataset.reveal) {
      state.revealed[t.dataset.reveal] = !state.revealed[t.dataset.reveal];
      render();
      return;
    }
    if (t.dataset.well) {
      const w = t.dataset.well;
      state.well = state.well === w ? null : w;
      if (state.well === "settings") ensureDraft();
      render();
      return;
    }
    if (t.dataset.toggleCh) {
      const ch = chBy(t.dataset.toggleCh);
      ch.disabled = !ch.disabled;
      render();
      return;
    }
    if (t.dataset.toggleModel) {
      const m = MODELS.find((x) => x.id === t.dataset.toggleModel);
      m.disabled = !m.disabled;
      render();
      return;
    }
    if (t.dataset.toggleCred) {
      const c = CREDS.find((x) => x.id === t.dataset.toggleCred);
      if (c.disabled) {
        c.disabled = false;
        c.reason = "";
        c.when = "";
        toast("已人工恢复");
      } else {
        c.disabled = true;
        c.reason = "已停用";
        c.when = "";
      }
      render();
      return;
    }
    if (t.dataset.toggleKey) {
      const k = KEYS.find((x) => x.id === t.dataset.toggleKey);
      k.disabled = !k.disabled;
      render();
      return;
    }
    if (t.dataset.delModel) {
      const m = MODELS.find((x) => x.id === t.dataset.delModel);
      askConfirm({
        title: "删除纳管模型",
        body: "从纳管列表里拿掉 " + m.name + "？不会动上游。",
        ok: "删除",
        run: () => { const i = MODELS.findIndex((x) => x.id === m.id); if (i >= 0) MODELS.splice(i, 1); },
      });
      return;
    }
    if (t.dataset.delCred) {
      const c = CREDS.find((x) => x.id === t.dataset.delCred);
      askConfirm({
        title: "删除上游凭证",
        body: "删除凭证「" + c.name + "」。",
        ok: "删除",
        run: () => { const i = CREDS.findIndex((x) => x.id === c.id); if (i >= 0) CREDS.splice(i, 1); },
      });
      return;
    }
    if (t.dataset.delKey) {
      const k = KEYS.find((x) => x.id === t.dataset.delKey);
      askConfirm({
        title: "删除 API Key",
        body: "删除「" + k.name + "」。持有这把钥匙的客户端会立刻 401。",
        ok: "删除",
        run: () => { const i = KEYS.findIndex((x) => x.id === k.id); if (i >= 0) KEYS.splice(i, 1); },
      });
      return;
    }
    if (t.dataset.delAp) {
      const a = APS.find((x) => x.id === t.dataset.delAp);
      askConfirm({
        title: "删除接入点",
        body: "删除接入点「" + a.name + "」。",
        ok: "删除",
        run: () => { const i = APS.findIndex((x) => x.id === a.id); if (i >= 0) APS.splice(i, 1); },
      });
      return;
    }
    if (t.dataset.mproto) {
      const m = MODELS.find((x) => x.id === t.dataset.mproto);
      const p = t.dataset.p;
      const ch = chBy(m.channel);
      let cur = (m.protocols && m.protocols.length) ? m.protocols.slice() : ch.protocols.slice();
      if (cur.includes(p)) cur = cur.filter((x) => x !== p);
      else cur.push(p);
      const inCh = ch.protocols.filter((x) => cur.includes(x));
      const rest = cur.filter((x) => !ch.protocols.includes(x));
      m.protocols = (inCh.length === ch.protocols.length && rest.length === 0) ? [] : [...inCh, ...rest];
      render();
      return;
    }
    if (t.dataset.proto) {
      readSettingsFromDom();
      const set = new Set(state.draft.protocols);
      if (set.has(t.dataset.proto)) {
        if (set.size > 1) set.delete(t.dataset.proto);
      } else set.add(t.dataset.proto);
      state.draft.protocols = PROTO_ORDER.filter((p) => set.has(p));
      refreshSettingsChrome();
      return;
    }
    if (t.dataset.keymode) {
      chBy(state.channel).key_mode = t.dataset.keymode;
      render();
      return;
    }
    if (t.dataset.editKey) {
      const k = KEYS.find((x) => x.id === t.dataset.editKey);
      state.keyForm = {
        id: k.id,
        name: k.name,
        unlimited: k.allow === "*",
        picked: k.allow === "*" ? [] : k.allow.split(",").filter(Boolean),
        disabled: k.disabled,
      };
      renderModal();
      return;
    }
    if (t.dataset.editAp) {
      const a = APS.find((x) => x.id === t.dataset.editAp);
      state.apForm = { id: a.id, name: a.name, channel: a.channel, model: a.model, weight: a.weight, disabled: a.disabled };
      renderModal();
      return;
    }
    if (t.dataset.log) {
      state.logDetail = Number(t.dataset.log);
      renderModal();
      return;
    }
    if (t.dataset.pageGo !== undefined) {
      const n = Number(t.dataset.pageGo);
      if (!Number.isNaN(n) && n >= 0) { state.logPage = n; render(); }
      return;
    }
    if (t.dataset.dim) { state.rankDim = t.dataset.dim; render(); return; }
    if (t.dataset.days) { state.rankDays = Number(t.dataset.days); render(); return; }
    if (t.dataset.kfAdd) {
      state.keyForm.picked.push(t.dataset.kfAdd);
      renderModal();
      return;
    }
    if (t.dataset.kfRm) {
      state.keyForm.picked = state.keyForm.picked.filter((x) => x !== t.dataset.kfRm);
      renderModal();
      return;
    }
    if (t.dataset.apCand) {
      state.apForm.channel = t.dataset.apCand;
      state.apForm.model = t.dataset.apModel;
      renderModal();
      return;
    }
    if (t.dataset.pickOne !== undefined) {
      /* handled via change on checkbox */
    }
    if (t.dataset.pickGroup) {
      const name = t.dataset.pickGroup;
      const cur = state.pick.expanded[name];
      state.pick.expanded[name] = cur === false ? true : false;
      renderModal();
      return;
    }
    if (t.dataset.pickGalli) {
      const gname = t.dataset.pickGalli;
      const ch = chBy(state.channel);
      const existing = new Set(modelsOf(ch.id).map((m) => m.name));
      const g = pickGroups(pickVisible()).find((x) => x.name === gname);
      const free = g.items.filter((n) => !existing.has(n));
      const on = free.every((n) => state.pick.picked[n]);
      free.forEach((n) => { if (on) delete state.pick.picked[n]; else state.pick.picked[n] = true; });
      renderModal();
      return;
    }

    const act = t.dataset.act;
    if (!act) return;
    if (act === "modal-close") { closeModal(); return; }
    if (act === "confirm-yes") {
      const run = state.confirm && state.confirm.run;
      closeModal();
      if (run) run();
      render();
      return;
    }
    if (act === "new-ch") {
      state.creating = true;
      state.well = null;
      state.draft = { id: "new", name: "", protocols: ["openai"], base_url: "", max_concurrency: "", supports_compaction: false, credential: "" };
      render();
      return;
    }
    if (act === "cancel-new") { state.creating = false; state.draft = null; render(); return; }
    if (act === "save-ch") { saveChannel(); return; }
    if (act === "create-ch") { createChannel(); return; }
    if (act === "del-ch") {
      const ch = chBy(state.channel);
      const n = apRefs(ch.name);
      askConfirm({
        title: "删除渠道",
        body: "删除渠道 " + ch.name + "。该渠道被 " + n + " 个接入点引用。",
        ok: "删除渠道",
        run: () => {
          const id = ch.id;
          const name = ch.name;
          const i = CHANNELS.findIndex((c) => c.id === id);
          if (i >= 0) CHANNELS.splice(i, 1);
          for (let j = MODELS.length - 1; j >= 0; j--) if (MODELS[j].channel === id) MODELS.splice(j, 1);
          for (let j = CREDS.length - 1; j >= 0; j--) if (CREDS[j].channel === id) CREDS.splice(j, 1);
          if (state.channel === id) state.channel = CHANNELS[0] ? CHANNELS[0].id : "";
          state.well = null;
          state.draft = null;
          void name;
        },
      });
      return;
    }
    if (act === "comp-yes" || act === "comp-no") {
      readSettingsFromDom();
      state.draft.supports_compaction = act === "comp-yes";
      refreshSettingsChrome();
      return;
    }
    if (act === "fetch") { openPicker(); return; }
    if (act === "probe") {
      state.probing = true;
      render();
      setTimeout(() => {
        state.probing = false;
        state.probed[state.channel] = true;
        toast("探测只提示，不落库");
        render();
      }, 420);
      return;
    }
    if (act === "add-cred-show") {
      state.addCred.show = !state.addCred.show;
      render();
      return;
    }
    if (act === "add-cred") {
      const name = (state.addCred.name || "").trim() || ("凭证 " + (credsOf(state.channel).length + 1));
      const value = state.addCred.value.trim();
      if (!value) return;
      CREDS.push({
        id: nextId("c"),
        channel: state.channel,
        name,
        value,
        mask: value.slice(0, 6) + "…" + value.slice(-4),
        disabled: false,
        created: "2026-08-16",
        reason: "",
        when: "",
      });
      state.addCred = { name: "", value: "", show: false };
      toast("已追加，不覆盖池子");
      render();
      return;
    }
    if (act === "new-key") {
      state.keyForm = { id: null, name: "", unlimited: true, picked: [], disabled: false };
      renderModal();
      return;
    }
    if (act === "key-save") {
      const f = state.keyForm;
      const allow = f.unlimited || f.picked.length === 0 ? "*" : f.picked.join(",");
      if (f.id) {
        const k = KEYS.find((x) => x.id === f.id);
        k.name = f.name.trim();
        k.allow = allow;
        k.disabled = !!f.disabled;
        closeModal();
        render();
        toast("已保存");
      } else {
        const plain = "sk-ptg-" + Math.random().toString(16).slice(2, 10) + "-demo-" + Math.random().toString(16).slice(2, 6);
        KEYS.unshift({
          id: nextId("k"),
          name: f.name.trim(),
          value: plain,
          mask: plain.slice(0, 10) + "…" + plain.slice(-4),
          allow,
          disabled: false,
          created: "2026-08-16 14:30",
        });
        state.keyForm = null;
        state.freshKey = plain;
        render();
        renderModal();
      }
      return;
    }
    if (act === "new-ap") {
      state.apForm = { id: null, name: "", channel: "", model: "", weight: 100, disabled: false };
      renderModal();
      return;
    }
    if (act === "ap-save") {
      const f = state.apForm;
      if (f.id) {
        const a = APS.find((x) => x.id === f.id);
        a.name = f.name.trim();
        a.channel = f.channel;
        a.model = f.model;
        a.weight = Number(f.weight) || 100;
        a.disabled = !!f.disabled;
      } else {
        APS.push({
          id: nextId("a"),
          name: f.name.trim(),
          channel: f.channel,
          model: f.model,
          weight: Number(f.weight) || 100,
          disabled: !!f.disabled,
        });
      }
      closeModal();
      render();
      toast("已保存");
      return;
    }
    if (act === "fail-only") { state.failOnly = !state.failOnly; state.logPage = 0; render(); return; }
    if (act === "log-refresh") { state.logPage = 0; toast("窗口钉住，新流水要刷新才进来"); render(); return; }
    if (act === "pw") { state.pw = { old: "", now: "" }; renderModal(); return; }
    if (act === "pw-save") {
      closeModal();
      toast("密码已更新。演示不真的登出。");
      return;
    }
    if (act === "out") { toast("演示：退出不会真的登出"); return; }
    if (act === "pick-managed") { state.pick.showManaged = !state.pick.showManaged; renderModal(); return; }
    if (act === "pick-reload") {
      state.pick.loading = true;
      renderModal();
      setTimeout(() => { if (state.pick) { state.pick.loading = false; renderModal(); } }, 380);
      return;
    }
    if (act === "pick-all") {
      const ch = chBy(state.channel);
      const existing = new Set(modelsOf(ch.id).map((m) => m.name));
      const pickable = pickVisible().filter((n) => !existing.has(n));
      const all = pickable.every((n) => state.pick.picked[n]);
      pickable.forEach((n) => { if (all) delete state.pick.picked[n]; else state.pick.picked[n] = true; });
      renderModal();
      return;
    }
    if (act === "pick-add") {
      const ch = chBy(state.channel);
      const names = Object.keys(state.pick.picked).filter((n) => state.pick.picked[n]);
      const existing = new Set(modelsOf(ch.id).map((m) => m.name));
      names.forEach((n) => {
        if (!existing.has(n)) MODELS.push({ id: nextId("m"), channel: ch.id, name: n, disabled: false, protocols: [] });
      });
      closeModal();
      render();
      toast("已纳管 " + names.length + " 个");
      return;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "log-model") { state.logModel = t.value; state.logPage = 0; render(); return; }
    if (t.id === "kf-unlim") { state.keyForm.unlimited = t.checked; renderModal(); return; }
    if (t.id === "kf-off") { state.keyForm.disabled = t.checked; return; }
    if (t.id === "ap-off") { state.apForm.disabled = t.checked; return; }
    if (t.dataset.pickOne) {
      if (t.checked) state.pick.picked[t.dataset.pickOne] = true;
      else delete state.pick.picked[t.dataset.pickOne];
      renderModal();
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "ch-search") { state.chQuery = t.value; renderRail(); return; }
    if (t.id === "set-name" || t.id === "set-base" || t.id === "set-conc" || t.id === "set-cred") {
      refreshSettingsChrome();
      return;
    }
    if (t.id === "add-model-in") { state.addModel = t.value; return; }
    if (t.id === "add-cred-name") { state.addCred.name = t.value; return; }
    if (t.id === "add-cred-val") {
      state.addCred.value = t.value;
      const btn = $("[data-act='add-cred']");
      const sh = $("[data-act='add-cred-show']");
      if (btn) btn.disabled = !t.value.trim();
      if (sh) sh.disabled = !t.value;
      return;
    }
    if (t.dataset.credName) {
      const c = CREDS.find((x) => x.id === t.dataset.credName);
      if (c) c.name = t.value;
      return;
    }
    if (t.id === "pick-q") {
      const pos = t.selectionStart;
      state.pick.query = t.value;
      renderModal();
      restoreField("pick-q", pos);
      return;
    }
    if (t.id === "kf-name") {
      state.keyForm.name = t.value;
      const b = $("[data-act='key-save']");
      if (b) b.disabled = !t.value.trim();
      return;
    }
    if (t.id === "ap-name") {
      state.apForm.name = t.value;
      const b = $("[data-act='ap-save']");
      if (b) b.disabled = !t.value.trim() || !state.apForm.model;
      return;
    }
    if (t.id === "ap-w") { state.apForm.weight = t.value; return; }
    if (t.id === "pw-old") {
      state.pw.old = t.value;
      const b = $("[data-act='pw-save']");
      if (b) b.disabled = !(state.pw.old && state.pw.now.length >= 8);
      return;
    }
    if (t.id === "pw-new") {
      state.pw.now = t.value;
      const b = $("[data-act='pw-save']");
      if (b) b.disabled = !(state.pw.old && state.pw.now.length >= 8);
      return;
    }
  });

  document.addEventListener("submit", (e) => {
    if (e.target.dataset.act === "add-models") {
      e.preventDefault();
      addModelsFromText(state.addModel);
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#modal").hidden) {
      closeModal();
    }
  });

  render();
})();
</script>
</body>
</html>
