name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # golden 样本是转换路径的防回归闸，-count=1 禁掉缓存，避免改了样本却复用旧结果。
      - name: Test
        run: go test -count=1 ./...
